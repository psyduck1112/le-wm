defaults:
  - _self_
  - data: libero_bc_drawer   # M1 默认: 双相机 v2 (这样裸跑 python train.py 就对)

output_dir: /home/yikang/stable-wm/outputs
output_model_name: lewm_libero_bc_drawer_v2
subdir: ${hydra:job.id}

num_workers: 8
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 200
  devices: 1
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2   # 配合 batch_size=256 -> 有效 batch 512 (双相机防 OOM)

loader:
  batch_size: 256   # 双相机显存: 物理 256 + 累积 2 = 有效 512
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 4
  pin_memory: True

optimizer:
  type: AdamW
  lr: 1e-4
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    project: lewm_libero_bc_drawer_v2
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
